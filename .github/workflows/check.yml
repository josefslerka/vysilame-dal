name: Herní kontroly

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Načíst zdrojové soubory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Připravit Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Ověřit herní jádra
        run: node qa/engines.test.cjs
      - name: Sestavit přenosnou hru
        run: node bundle.cjs
      - name: Ověřit přenosné HTML
        run: node qa/portable.test.cjs
      - name: Zkontrolovat aktuálnost přenosné hry
        run: git diff --exit-code -- hry.html
